# con "contraseña de aplicación": https://myaccount.google.com/apppasswords)
smtp_host = smtp.gmail.com
smtp_port = 587
usuario   =
password  =
remitente = Ficha ENOE Jalisco <correo.del.proyecto@gmail.com>

# Quién recibe la ficha (separados por coma)
destinatarios =
